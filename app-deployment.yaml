apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-flask-app
  namespace: default
  labels:
    app: gitops-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-flask
  template:
    metadata:
      labels:
        app: gitops-flask
    spec:
      containers:
      - name: flask-app
        image: nginx:alpine  # Shuru mein test ke liye ya apni Flask app image
        ports:
        - containerPort: 80
